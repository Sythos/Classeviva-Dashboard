name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check that the tag matches the manifest version
        run: |
          version=$(python3 -c "import json; print(json.load(open('custom_components/cvv_dashboard/manifest.json'))['version'])")
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match manifest version ${version}"
            exit 1
          fi
      - name: Build the archive
        run: |
          cd custom_components/cvv_dashboard
          zip -r ../../cvv_dashboard.zip . -x "*__pycache__*"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" cvv_dashboard.zip --title "${GITHUB_REF_NAME}" --generate-notes
