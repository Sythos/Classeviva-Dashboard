name: Validation

on:
  push:
    tags:
      - "**"
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hacs/action@main
        with:
          category: integration

  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check that the changelog has a section for the manifest version
        run: |
          version=$(python3 -c "import json; print(json.load(open('custom_components/cvv_dashboard/manifest.json'))['version'])")
          bash .github/scripts/release-notes.sh "${version}" > /dev/null

  syntax:
    name: Syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Compile Python files
        run: python -m compileall -q custom_components/cvv_dashboard
      - name: Check JavaScript syntax
        run: node --check custom_components/cvv_dashboard/www/cvv-dashboard-card.js
      - name: Run the card tests
        run: node --test tests/
